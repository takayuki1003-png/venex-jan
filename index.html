<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>VENEX JAN Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--line:#d9dee8;--text:#1f2937;
  --muted:#64748b;--orange:#f28c28;--green:#047857;--red:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Meiryo UI","Yu Gothic UI",sans-serif}
body{min-height:100dvh}
header{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header strong{font-size:16px}
header small{margin-left:auto;color:#cbd5e1}
main{max-width:680px;margin:0 auto;padding:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:10px;box-shadow:0 6px 20px rgba(15,23,42,.06)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:11px;font-weight:900}
.tabs button.active{background:#111827;color:#fff;border-color:#111827}
.camera-shell{position:relative;overflow:hidden;border-radius:12px;background:#000;height:min(70vh,650px);min-height:360px}
#video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
#reader{display:none;overflow:hidden;border-radius:12px;background:#000;min-height:360px}
.scan-guide{
  position:absolute;
  left:4%; right:4%;
  top:43%;
  height:16%;
  border:3px solid rgba(255,255,255,.96);
  border-radius:4px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.27);
  pointer-events:none
}
.scan-guide:after{
  content:"この枠にバーコードを1本だけ";
  position:absolute;left:8px;bottom:6px;
  background:rgba(0,0,0,.68);color:#fff;
  font-size:11px;padding:4px 7px;border-radius:5px
}
.scan-line{
  position:absolute;left:6%;right:6%;top:50%;
  height:2px;background:#ff3b30;opacity:.85;pointer-events:none
}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
button,select,input{font:inherit}
.btn{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:11px;font-weight:900}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.dark{background:#111827;border-color:#111827;color:#fff}
.btn:disabled{opacity:.45}
.manual{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:9px}
.manual input{min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:11px;font-size:18px;letter-spacing:.04em}
.status{margin-top:9px;padding:10px 11px;border-radius:10px;background:#f1f5f9;font-size:12px;line-height:1.5}
.status.ok{background:#ecfdf5;color:var(--green)}
.status.err{background:#fef2f2;color:var(--red)}
.status.warn{background:#fff7ed;color:#9a3412}
.debug{font-size:11px;color:#64748b;margin-top:6px;word-break:break-all}
.product{display:none;margin-top:10px;border:1px solid #e2e8f0;border-radius:11px;padding:11px}
.product.show{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.product strong{font-size:16px}
.product small{color:var(--muted);grid-column:1/-1;line-height:1.5}
.price{font-size:18px;font-weight:900}
.inventory-options{display:none;margin-top:9px}
.inventory-options.show{display:block}
.inventory-options select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:#fff}
.zoom-wrap{display:none;margin-top:9px}
.zoom-wrap.show{display:block}
.zoom-wrap label{font-size:12px;font-weight:800}
.zoom-wrap input{width:100%}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.summary>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px}
.summary span{display:block;font-size:10px;color:var(--muted);font-weight:800}
.summary strong{font-size:17px}
.settings details{font-size:12px}
.settings summary{cursor:pointer;font-weight:800}
.settings-grid{display:grid;gap:7px;margin-top:9px}
.settings-grid input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px}
.hidden-frame{position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<header>
  <strong>VENEX JAN Scanner</strong>
  <small id="cameraState">停止中</small>
</header>

<main>
  <section class="card">
    <div class="tabs">
      <button id="saleTab" class="active" type="button">レジ</button>
      <button id="inventoryTab" type="button">在庫カウント</button>
    </div>
  </section>

  <section class="card">
    <div id="nativeWrap" class="camera-shell">
      <video id="video" playsinline muted></video>
      <div class="scan-guide"></div>
      <div class="scan-line"></div>
    </div>
    <div id="reader"></div>

    <div class="controls">
      <button id="startBtn" class="btn dark" type="button">📷 カメラ開始</button>
      <button id="stopBtn" class="btn" type="button" disabled>停止</button>
    </div>

    <div id="zoomWrap" class="zoom-wrap">
      <label>ズーム <span id="zoomValue"></span></label>
      <input id="zoomSlider" type="range" step="0.1">
    </div>

    <div class="manual">
      <input id="manualJan" inputmode="numeric" maxlength="13" placeholder="JAN手入力">
      <button id="manualBtn" class="btn" type="button">追加</button>
    </div>

    <div id="inventoryOptions" class="inventory-options">
      <select id="location">
        <option value="棚上">棚上</option>
        <option value="棚下">棚下</option>
      </select>
    </div>

    <div id="status" class="status">
      「カメラ開始」を押してください。
    </div>
    <div id="debug" class="debug"></div>
    <div id="product" class="product"></div>
  </section>

  <section id="saleCard" class="card">
    <button id="nextCustomerBtn" class="btn primary" type="button" style="width:100%">
      次のお客様
    </button>
    <div class="summary">
      <div><span>今回の読取点数</span><strong id="sessionQty">0点</strong></div>
      <div><span>小計</span><strong id="sessionTotal">¥0</strong></div>
    </div>
  </section>

  <section class="card settings">
    <details id="settingsDetails">
      <summary>⚙ 接続設定</summary>
      <div class="settings-grid">
        <label>Apps Script /exec URL
          <input id="apiUrl" type="url">
        </label>
        <label>認証トークン
          <input id="apiToken" type="password">
        </label>
        <button id="saveSettingsBtn" class="btn" type="button">設定を保存</button>
      </div>
    </details>
  </section>
</main>

<iframe id="apiFrame" name="apiFrame" class="hidden-frame"></iframe>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const state = {
    mode:'sale',
    stream:null,
    track:null,
    detector:null,
    fallbackScanner:null,
    loopTimer:0,
    scanning:false,
    busy:false,
    engine:'',
    lastCandidate:'',
    sameCount:0,
    lastAccepted:'',
    lastAcceptedAt:0,
    newCheckout:true,
    sessionQty:0,
    sessionTotal:0,
    pending:new Map()
  };

  function money(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
  function status(t,k=''){ const e=$('status'); e.textContent=t; e.className='status'+(k?' '+k:''); }
  function debug(t=''){ $('debug').textContent=t; }

  function settings(){
    return {
      url:localStorage.getItem('venexJanApiUrl')||'',
      token:localStorage.getItem('venexJanApiToken')||''
    };
  }

  function loadSettings(){
    const s=settings();
    $('apiUrl').value=s.url;
    $('apiToken').value=s.token;
    if(!s.url||!s.token) $('settingsDetails').open=true;
  }

  function saveSettings(){
    const url=$('apiUrl').value.trim();
    const token=$('apiToken').value.trim();
    if(!url.endsWith('/exec')) return status('URLは /exec で終わるものを入力してください。','err');
    if(!token) return status('認証トークンを入力してください。','err');
    localStorage.setItem('venexJanApiUrl',url);
    localStorage.setItem('venexJanApiToken',token);
    $('settingsDetails').open=false;
    status('接続設定を保存しました。','ok');
  }

  function validEan13(code){
    if(!/^\d{13}$/.test(code)) return false;
    let sum=0;
    for(let i=0;i<12;i++) sum += Number(code[i])*(i%2===0?1:3);
    return ((10-(sum%10))%10)===Number(code[12]);
  }

  function validJan(code){
    return validEan13(code) && /^(45|49)/.test(code);
  }

  function chooseBestDetection(codes, video){
    if(!codes || !codes.length) return null;

    const vw=video.videoWidth||1;
    const vh=video.videoHeight||1;

    // 白枠: x 4〜96%, y 43〜59%
    const gx1=vw*0.04, gx2=vw*0.96;
    const gy1=vh*0.43, gy2=vh*0.59;
    const centerY=vh*0.51;

    const candidates = codes
      .map(b => {
        const raw=String(b.rawValue||'').replace(/\D/g,'');
        const box=b.boundingBox;
        if(!box || !validJan(raw)) return null;

        const cx=box.x + box.width/2;
        const cy=box.y + box.height/2;

        const inGuide = cx>=gx1 && cx<=gx2 && cy>=gy1 && cy<=gy2;
        if(!inGuide) return null;

        return {raw, dist:Math.abs(cy-centerY), box};
      })
      .filter(Boolean)
      .sort((a,b)=>a.dist-b.dist);

    return candidates[0] || null;
  }

  function acceptCandidate(code){
    if(code===state.lastCandidate) state.sameCount++;
    else { state.lastCandidate=code; state.sameCount=1; }

    debug('候補 ' + code + '　確認 ' + state.sameCount + '/2');

    if(state.sameCount<2) return;

    const now=Date.now();
    if(code===state.lastAccepted && now-state.lastAcceptedAt<1700) return;

    state.lastAccepted=code;
    state.lastAcceptedAt=now;
    state.lastCandidate='';
    state.sameCount=0;

    handleJan(code,'カメラ');
  }

  async function startScanner(){
    if(state.scanning) return;
    const s=settings();

    if(!s.url||!s.token){
      $('settingsDetails').open=true;
      return status('先に接続設定を入力してください。','err');
    }

    $('startBtn').disabled=true;
    status('カメラを起動しています…');

    try{
      if('BarcodeDetector' in window){
        const supported=await BarcodeDetector.getSupportedFormats();
        if(supported.includes('ean_13')){
          await startNative();
          return;
        }
      }
    }catch(e){}

    await startFallback();
  }

  async function startNative(){
    try{
      state.detector=new BarcodeDetector({formats:['ean_13']});

      state.stream=await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:3840},
          height:{ideal:2160}
        },
        audio:false
      });

      state.track=state.stream.getVideoTracks()[0];

      try{
        const caps=state.track.getCapabilities ? state.track.getCapabilities() : {};
        const adv={};

        if(caps.focusMode && caps.focusMode.includes('continuous')){
          adv.focusMode='continuous';
        }

        if(Object.keys(adv).length){
          await state.track.applyConstraints({advanced:[adv]});
        }

        if(caps.zoom){
          $('zoomWrap').classList.add('show');
          $('zoomSlider').min=caps.zoom.min;
          $('zoomSlider').max=caps.zoom.max;
          $('zoomSlider').step=caps.zoom.step||0.1;

          const defaultZoom=Math.min(
            caps.zoom.max,
            Math.max(caps.zoom.min, 1.5)
          );

          $('zoomSlider').value=defaultZoom;
          $('zoomValue').textContent=defaultZoom.toFixed(1)+'x';

          try{
            await state.track.applyConstraints({advanced:[{zoom:defaultZoom}]});
          }catch(e){}
        }
      }catch(e){}

      const video=$('video');
      video.srcObject=state.stream;
      await video.play();

      $('nativeWrap').style.display='block';
      $('reader').style.display='none';

      state.engine='native';
      state.scanning=true;
      $('stopBtn').disabled=false;
      $('cameraState').textContent='読取中';
      status('バーコードを1本だけ赤線に重ねてください。','ok');
      debug('Android Chrome EAN-13 / 高解像度');

      nativeLoop();

    }catch(e){
      await stopScanner();
      await startFallback();
    }
  }

  async function nativeLoop(){
    if(!state.scanning || state.engine!=='native') return;

    const video=$('video');

    if(video.readyState>=2 && !state.busy){
      try{
        const codes=await state.detector.detect(video);
        const best=chooseBestDetection(codes,video);

        if(best) acceptCandidate(best.raw);
        else if(codes.length){
          const raws=codes.map(x=>String(x.rawValue||'')).filter(Boolean);
          debug('検出したが枠外: '+raws.join(', '));
        }
      }catch(e){}
    }

    state.loopTimer=setTimeout(nativeLoop,90);
  }

  async function startFallback(){
    if(!window.Html5Qrcode){
      $('startBtn').disabled=false;
      return status('ライブ読取非対応です。JAN手入力を使用してください。','err');
    }

    try{
      $('nativeWrap').style.display='none';
      $('reader').style.display='block';

      const F=Html5QrcodeSupportedFormats;

      state.fallbackScanner=new Html5Qrcode('reader',{
        formatsToSupport:[F.EAN_13],
        verbose:false
      });

      const w=Math.max(260,Math.min(430,(window.innerWidth||360)-30));

      await state.fallbackScanner.start(
        {facingMode:'environment'},
        {
          fps:15,
          qrbox:{width:w,height:110},
          aspectRatio:1.7778
        },
        decoded=>{
          const code=String(decoded||'').replace(/\D/g,'');
          if(validJan(code)) acceptCandidate(code);
        },
        ()=>{}
      );

      state.engine='fallback';
      state.scanning=true;
      $('stopBtn').disabled=false;
      $('cameraState').textContent='読取中';
      status('バーコードを1本だけ枠内に入れてください。','ok');
      debug('html5-qrcode / EAN-13');

    }catch(e){
      state.scanning=false;
      $('startBtn').disabled=false;
      $('stopBtn').disabled=true;
      status('カメラ開始エラー: '+(e?.message||e),'err');
    }
  }

  async function stopScanner(){
    state.scanning=false;

    if(state.loopTimer){
      clearTimeout(state.loopTimer);
      state.loopTimer=0;
    }

    if(state.stream){
      state.stream.getTracks().forEach(t=>t.stop());
    }

    state.stream=null;
    state.track=null;

    try{
      if(state.fallbackScanner){
        await state.fallbackScanner.stop();
        await state.fallbackScanner.clear();
      }
    }catch(e){}

    state.fallbackScanner=null;
    state.detector=null;
    state.engine='';

    $('zoomWrap').classList.remove('show');
    $('startBtn').disabled=false;
    $('stopBtn').disabled=true;
    $('cameraState').textContent='停止中';
  }

  function setMode(mode){
    state.mode=mode;
    $('saleTab').classList.toggle('active',mode==='sale');
    $('inventoryTab').classList.toggle('active',mode==='inventory');
    $('inventoryOptions').classList.toggle('show',mode==='inventory');
    $('saleCard').style.display=mode==='sale'?'block':'none';
  }

  function postToApi(params){
    const s=settings();

    return new Promise((resolve,reject)=>{
      const requestId=Date.now().toString(36)+Math.random().toString(36).slice(2);

      const timer=setTimeout(()=>{
        state.pending.delete(requestId);
        reject(new Error('Apps Scriptから応答がありません。'));
      },12000);

      state.pending.set(requestId,{resolve,reject,timer});

      const form=document.createElement('form');
      form.method='POST';
      form.action=s.url;
      form.target='apiFrame';
      form.style.display='none';

      const all={...params,requestId,token:s.token};

      Object.entries(all).forEach(([k,v])=>{
        const input=document.createElement('input');
        input.type='hidden';
        input.name=k;
        input.value=String(v??'');
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
      setTimeout(()=>form.remove(),1000);
    });
  }

  window.addEventListener('message',e=>{
    const data=e.data;
    if(!data||!data.requestId) return;

    const p=state.pending.get(data.requestId);
    if(!p) return;

    clearTimeout(p.timer);
    state.pending.delete(data.requestId);

    if(data.ok) p.resolve(data);
    else p.reject(new Error(data.error||'Apps Scriptエラー'));
  });

  async function handleJan(raw,source){
    if(state.busy) return;

    const jan=String(raw||'').replace(/\D/g,'');

    if(!validEan13(jan)){
      return status('正しい13桁JANではありません。','err');
    }

    state.busy=true;
    status('JAN '+jan+' を登録しています…','warn');

    try{
      const params=state.mode==='sale'
        ? {action:'sale',jan,newCheckout:state.newCheckout?'1':'0'}
        : {action:'inventory',jan,location:$('location').value};

      const r=await postToApi(params);
      const p=r.product||{};

      $('product').className='product show';
      $('product').innerHTML=
        '<strong>'+String(p.name||'')+'</strong>'+
        '<div class="price">'+money(p.price)+'</div>'+
        '<small>'+[p.color,p.size].filter(Boolean).join(' / ')+
        '<br>JAN '+String(p.jan||jan)+'</small>';

      if(state.mode==='sale'){
        state.newCheckout=false;
        state.sessionQty++;
        state.sessionTotal+=Number(p.price||0);
        $('sessionQty').textContent=state.sessionQty+'点';
        $('sessionTotal').textContent=money(state.sessionTotal);
        status('✓ '+p.name+' を登録しました。','ok');
      }else{
        status('✓ '+p.name+' を '+r.location+' に追加しました。','ok');
      }

      try{
        if(navigator.vibrate) navigator.vibrate([60,30,60]);
      }catch(e){}

    }catch(e){
      status(e.message||String(e),'err');
    }finally{
      state.busy=false;
    }
  }

  $('zoomSlider').addEventListener('input',async e=>{
    const z=Number(e.target.value);
    $('zoomValue').textContent=z.toFixed(1)+'x';

    if(state.track){
      try{
        await state.track.applyConstraints({advanced:[{zoom:z}]});
      }catch(err){}
    }
  });

  $('startBtn').onclick=startScanner;
  $('stopBtn').onclick=stopScanner;
  $('saveSettingsBtn').onclick=saveSettings;

  $('saleTab').onclick=()=>setMode('sale');
  $('inventoryTab').onclick=()=>setMode('inventory');

  $('manualBtn').onclick=()=>handleJan($('manualJan').value,'手入力');

  $('manualJan').addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      handleJan(e.target.value,'手入力');
    }
  });

  $('nextCustomerBtn').onclick=()=>{
    state.newCheckout=true;
    state.sessionQty=0;
    state.sessionTotal=0;
    $('sessionQty').textContent='0点';
    $('sessionTotal').textContent='¥0';
    status('次に読むJANから新しい会計です。','ok');
  };

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden && state.scanning) stopScanner();
  });

  loadSettings();
})();
</script>
</body>
</html>
